version: 0.2

env:
  variables:
    AWS_REGION: ap-south-1
    ECR_REPO: backend

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_TAG=$CODEBUILD_BUILD_NUMBER
      - echo Using image tag $IMAGE_TAG

  build:
    commands:
      - echo Building backend Docker image...
      - docker build -t $ECR_REPO:$IMAGE_TAG ecommerce-backend
      - docker tag $ECR_REPO:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing backend image to ECR...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

      # Pass tag to CodeDeploy (EC2)
      - echo IMAGE_TAG=$IMAGE_TAG > image.env
      - cat image.env

      # ECS deployment file (for Fargate)
      - printf '[{"name":"backend","imageUri":"%s"}]' "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - appspec.yml
    - cicd/scripts/**/*
    - image.env
    - imagedefinitions.json
